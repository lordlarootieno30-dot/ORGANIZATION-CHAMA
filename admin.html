<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ADMIN - TRUST CIRCLE</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0f0f0f;color:#fff;padding:15px}.card{background:#1a1a1a;border-radius:15px;padding:20px;margin-bottom:15px;border:1px solid #333}input{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;font-size:16px;margin:10px 0}.btn{width:100%;padding:16px;border:none;border-radius:10px;background:#00ff88;color:#000;font-weight:bold;font-size:17px;cursor:pointer}.member{display:flex;justify-content:space-between;padding:10px;background:#222;border-radius:8px;margin:5px 0}.del{background:red;color:#fff;border:none;padding:5px 10px;border-radius:5px}</style></head><body>
<div class="card" id="login"><h1 style="color:#00ff88;text-align:center">🔐 ADMIN LOGIN</h1><p style="text-align:center;color:#aaa;margin-top:10px">Wewe pekee ndio unaingia hapa</p><input type="password" id="pass" placeholder="Weka Password"><button class="btn" onclick="login()">INGIA</button><p style="text-align:center;font-size:12px;color:#888;margin-top:10px">Password ya kwanza ni: 1234 - Utabadilisha baadaye</p></div>
<div class="card" id="dash" style="display:none"><h1 style="color:#00ff88;text-align:center">👑 ADMIN - TRUST CIRCLE</h1><p style="text-align:center;margin:10px 0">💰 Jumla: <b id="total">KES 0</b> | 👥 Watu: <b id="count">0</b></p><div id="list"></div><button class="btn" style="background:red;color:#fff;margin-top:15px" onclick="clearAll()">🗑️ Futa Wote - Anza Wiki Mpya</button><br><br><a href="index.html" style="color:#00ff88">← Rudi Kwa Mbele</a></div>
<script>
function login(){ if(document.getElementById('pass').value=='1234'){ document.getElementById('login').style.display='none'; document.getElementById('dash').style.display='block'; render(); } else { alert('Password si sahihi! Jaribu 1234'); } }
let members = JSON.parse(localStorage.getItem('trust_members')||'[]');
function render(){ let total=members.reduce((a,b)=>a+parseInt(b.amount),0); document.getElementById('total').innerText='KES '+total.toLocaleString(); document.getElementById('count').innerText=members.length; document.getElementById('list').innerHTML = members.length==0 ? '<p style="color:#888">Hakuna mtu bado</p>' : members.map((m,i)=>`<div class="member"><span>👤 ${m.name} - ${m.phone} - KES ${m.amount}</span><button class="del" onclick="del(${i})">X</button></div>`).join(''); }
function del(i){ if(confirm('Futa huyu?')){ members.splice(i,1); localStorage.setItem('trust_members',JSON.stringify(members)); render(); } }
function clearAll(){ if(confirm('Futa WOTE? Wiki mpya?')){ members=[]; localStorage.setItem('trust_members','[]'); render(); } }
</script></body></html>
