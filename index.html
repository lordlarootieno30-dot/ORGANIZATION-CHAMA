<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRUST CIRCLE - Chama Automatic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff;padding:15px}
.card{background:#1a1a1a;border-radius:15px;padding:20px;margin-bottom:15px;border:1px solid #333}
h1{color:#00ff88;text-align:center;font-size:24px}
.sub{text-align:center;color:#aaa;margin:5px 0 15px}
label{display:block;margin:12px 0 5px;color:#ccc;font-size:14px}
input,select{width:100%;padding:14px;border-radius:10px;border:1px solid #444;background:#222;color:#fff;font-size:16px}
.btn{width:100%;padding:16px;border:none;border-radius:10px;background:#00ff88;color:#000;font-weight:bold;font-size:17px;margin-top:15px;cursor:pointer}
.btn:disabled{background:#555;color:#999}
.success{background:#00331a;border:1px solid #00ff88;padding:15px;border-radius:10px;margin-top:15px;display:none}
.member{display:flex;justify-content:space-between;padding:10px;background:#222;border-radius:8px;margin:5px 0}
.badge{background:#00ff88;color:#000;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:bold}
</style>
</head>
<body>

<div class="card">
<h1>💰 TRUST CIRCLE</h1>
<p class="sub">Chama Automatic - M-Pesa STK Push via IntaSend</p>
<p style="text-align:center">📊 Wiki Hii: <b id="total">KES 0</b> | Wanachama: <b id="count">0</b></p>
</div>

<div class="card">
<h3>🧾 Lipa Mchango Wako - AUTOMATIC</h3>
<label>Jina Lako</label>
<input id="name" placeholder="Mfano: Spike Rich">
<label>Namba ya M-PESA</label>
<input id="phone" placeholder="0116799615 au 0712345678">
<label>Kiasi (KES)</label>
<select id="amount">
<option value="500">500 - Mchango wa Wiki</option>
<option value="1000">1000 - Wiki 2</option>
<option value="2000">2000 - Wiki 4</option>
</select>
<button class="btn" id="payBtn" onclick="payNow()">📱 LIPA SASA - STK Itatumwa Kwa Simu Yako</button>
<p style="font-size:12px;color:#aaa;text-align:center;margin-top:10px">Baada ya kubonyeza, simu yako italeta "Weka PIN ya M-PESA" - Weka PIN ili kuthibitisha!</p>
<div class="success" id="msg"></div>
</div>

<div class="card">
<h3>👥 Wanachama Walio Lipa Wiki Hii</h3>
<div id="list"><p style="color:#888">Hakuna malipo bado - Kuwa wa kwanza!</p></div>
</div>

<script>
// ==== BADILISHA HAPA BAADA YA APPROVAL ====
// Utapata hii kwenye IntaSend Dashboard > Settings > API Keys
const INTASEND_PUB_KEY = "ISPubKey_test_XXXX"; // Weka yako ya LIVE hapa baadaye
// Secret Key USIWEKE HAPA! Inakaa kwa Server pekee!
// ============================================

let members = JSON.parse(localStorage.getItem('trust_members')||'[]');
render();

function formatPhone(p){
  p = p.replace(/\s/g,'');
  if(p.startsWith('0')) return '254'+p.slice(1);
  if(p.startsWith('+254')) return p.slice(1);
  return p;
}

async function payNow(){
  const name = document.getElementById('name').value.trim();
  const phoneRaw = document.getElementById('phone').value.trim();
  const amount = document.getElementById('amount').value;
  const btn = document.getElementById('payBtn');
  const msg = document.getElementById('msg');

  if(!name || !phoneRaw){ alert('Weka Jina na Namba!'); return; }
  const phone = formatPhone(phoneRaw);

  btn.disabled = true; btn.innerText = '⏳ Inatuma STK kwa '+phoneRaw+'...';
  msg.style.display='block'; msg.innerHTML='⏳ STK imetumwa! Angalia simu yako, weka PIN ya M-PESA...';

  // KAMA BADO HUNA LIVE KEYS, HII ITAFANYA TEST MODE:
  // Baada ya approval, tutaunganisha na IntaSend API ya ukweli hapa.
  // Kwa sasa inasimulate ili uone design.

  try{
    // Hapa ndipo tutaweka API call ya IntaSend baada ya approval:
    // fetch('https://api.intasend.com/api/v1/payment/mpesa-stk-push/', ...)
    // Kwa sasa tunasubiri approval, tunaonyesha demo:
    setTimeout(()=>{
      members.unshift({name:name, phone:phoneRaw, amount:amount, time:new Date().toLocaleString()});
      localStorage.setItem('trust_members', JSON.stringify(members));
      render();
      msg.innerHTML = '✅ <b>IMEPOKELEWA! Asante '+name+'!</b><br>KES '+amount+' - STK Imethibitishwa (TEST MODE - Subiri Live Keys)';
      btn.disabled=false; btn.innerText='📱 LIPA SASA - STK Itatumwa Kwa Simu Yako';
    }, 3000);
  }catch(e){
    msg.innerHTML='❌ Imeshindwa. Jaribu tena.';
    btn.disabled=false;
  }
}

function render(){
  let total = members.reduce((a,b)=>a+parseInt(b.amount),0);
  document.getElementById('total').innerText='KES '+total.toLocaleString();
  document.getElementById('count').innerText=members.length;
  const list = document.getElementById('list');
  if(members.length===0) return;
  list.innerHTML = members.map(m=>`<div class="member"><span>👤 ${m.name} - ${m.phone}</span><span><b>KES ${m.amount}</b> <span class="badge">✅</span></span></div>`).join('');
}
</script>
</body>
</html>
